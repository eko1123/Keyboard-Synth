<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Hello Web Audio</title>
    </head>

    <body>
        <h1>Keyboard Synth</h1>
        <button id="waveTypeButton">Change Wave Type: (currently sine)</button>
        <button id="lfoButton">Toggle LFO: (currently off)</button>
        <label id="lfoContainer" style="display: none;">
            LFO frequency:
            <input id="lfoFreq" type="range" min="0" max="20" value="5" step="0.1">
            LFO depth:
            <input id="lfoDepth" type="range" min="0" max="0.5" value="0.5" step="0.01">
        </label>
        <h3>Synth Type</h3>
        <div>
            <select id="synthTypeSelect">
                <option value="single">Single</option>
                <option value="additive">Additive</option>
                <option value="am">AM</option>
                <option value="fm">FM</option>
            </select>
        </div>
        <label id="additiveOptions" style="display: none;">
                Additive options:
                <select id="additiveSynthTypeSelect">
                    <option value="odd">Odd</option>
                    <option value="even">Even</option>
                    <option value="all">All</option>
                </select>
        </label>
        <label id="amContainer" style="display: none;">
                AM options:
                mod freq multiple
                <input id="amFreq" type="range" min="0.1" max="20" value="2" step="0.1">
                <span id="amFreqValue">2.0</span>
                index multiple
                <input id="amIndex" type="range" min="0" max="1" value="0.5" step="0.01">
                <span id="amIndexValue">0.5</span>
        </label>
        <label id="fmContainer" style="display: none;">
                FM options:
                mod freq multiple
                <input id="fmFreq" type="range" min="0.1" max="20" value="2" step="0.1">
                <span id="fmFreqValue">2.0</span>
                index multiple
                <input id="fmIndex" type="range" min="0" max="20" value="2" step="0.1">
                <span id="fmIndexValue">2.0</span>
        </label>
        <h3>Temperament</h3>
        <div>
            <button class="temp" data-temp="et">Equal (12-TET)</button>
            <button class="temp" data-temp="well">Well (Werckmeister III)</button>
            <button class="temp" data-temp="ji">Pure (Just Intonation)</button>
        </div>

        <h3>Root note</h3>
        <label id="rootContainer">
            Root:
            <select id="rootSelect"></select>
        </label>
        <p id="tuningStatus"></p>
    </body>
    <script src="keyboard.js"></script>
</html>
